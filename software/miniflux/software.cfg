# Miniflux 2.1.1, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/golang/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml e7591b0382886a4c615fcce67a910e8f
  scripts/download.sh 4f320ca7696e4830128aa30c9ca6508c
commands =
  bash scripts/download.sh
  make miniflux
tools = ${golang1.23:location}/bin:${:base-tools}

[python-app]
name = miniflux
eggs =
health = /healthcheck
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  RUN_MIGRATIONS=1
  CREATE_ADMIN=1
  ADMIN_USERNAME="$HOP3_ADMIN_USER"
  ADMIN_PASSWORD="$HOP3_ADMIN_PASSWORD"

[python-app-processes]
web = ./miniflux
