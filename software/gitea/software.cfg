# Gitea 1.21.4, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
# Provisional: runs the binary the recipe fetches, where a SlapOS release builds
# from source. To replace with a port of a variant of the recipe that does.
[buildout]
extends =
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml ffcb5aa4b4c73532fd80eb5de420a70f
  scripts/download.sh e59e6767bbfe4e18f5c745d015ec11be
  scripts/setup-config.sh bce8f34f9cec6ccd03208e205557a6bf
  hop3-admin-create.sh 6629bb36f7f18b65d6f6ffef7bd529ae
commands =
  bash scripts/download.sh

[python-app]
name = gitea
eggs =
health = /
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD SECRET_KEY:base64 INTERNAL_TOKEN:hex JWT_SECRET:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=hop3admin
  HOP3_ADMIN_EMAIL=admin@gitea.invalid
volumes =
  data data

[python-app-processes]
release = bash scripts/setup-config.sh && bash hop3-admin-create.sh
web = ./gitea web
