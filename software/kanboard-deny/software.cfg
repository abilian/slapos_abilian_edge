# Kanboard 1.2.37, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../component/mariadb/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md 1cb41cd5b7b8971ff147fcd780b667ba
  hop3.toml aa5475ca59377e0bc8fc304ed6bb01dd
  scripts/download.sh 0493e2cde6b152ee50c2e7cdff7aa25e
  scripts/reset-admin.sh d1a67163008543fc97124328037f8079
  scripts/setup-config.sh 509d490cb3db88ef52fb557977afba32
commands =
  bash scripts/download.sh
  chmod -R 755 . && chmod -R 777 data plugins
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = kanboard-deny
eggs =
health = /
mariadb-bin = ${mariadb:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  DEBUG=false
  HOP3_PROXY_DENY='/app /cli /config.default.php /config.php /custom-hooks /data /hop3.toml /libs /scripts /vendor /web.config'
volumes =
  data data

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh && php cli db:migrate && bash scripts/reset-admin.sh
