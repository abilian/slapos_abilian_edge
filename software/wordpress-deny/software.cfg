# WordPress 7.1.4, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../component/mariadb/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md d6cda08be24c42f451f26604f92a208d
  hop3.toml 7c54ed69ee0891ddeb0858157746fd44
  scripts/download.sh 9a53920c6c27d96ca3f4377f66f97759
  scripts/probe-user.php e3aee751b357a67e7918344990083b4b
  scripts/setup-config.sh 7b376b877cd2a6846ff6b302bf5e84a1
  scripts/wp-install.php c10a72ab79e850e0a708d78879aa976e
commands =
  bash scripts/download.sh
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = wordpress-deny
eggs =
health = /wp-login.php
mariadb-bin = ${mariadb:location}/bin
secrets = HOP3_ADMIN_PASSWORD AUTH_KEY:base64 SECURE_AUTH_KEY:base64 LOGGED_IN_KEY:base64 NONCE_KEY:base64 AUTH_SALT:base64 SECURE_AUTH_SALT:base64 LOGGED_IN_SALT:base64 NONCE_SALT:base64
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@wordpress-deny.invalid
  WP_DEBUG=false
  WP_TITLE=WordPress
  WP_ADMIN_USER="$HOP3_ADMIN_USER"
  WP_ADMIN_EMAIL="$HOP3_ADMIN_EMAIL"
  WP_ADMIN_PASSWORD="$HOP3_ADMIN_PASSWORD"
  HOP3_PROXY_DENY='/README.md /hop3.toml /readme.html /scripts /wp-config-sample.php /wp-config.php'
volumes =
  uploads wp-content/uploads
  plugins wp-content/plugins
  themes wp-content/themes

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
