# LimeSurvey 6.16, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md fc9a719bf7997070055b9cae2a93fdfd
  hop3.toml ec012d9e296c75d06eb6d1286608d076
  scripts/download.sh aea7bcd67ea8801760fb02b576412d22
  scripts/setup-config.sh 153d68daaf7ad705ffc48cafe16ced36
commands =
  bash scripts/download.sh
  composer install --no-dev --optimize-autoloader || true
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = limesurvey-deny
eggs =
health = /
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@limesurvey-deny.invalid
  ADMIN_NAME=Administrator
  ADMIN_USER="$HOP3_ADMIN_USER"
  ADMIN_EMAIL="$HOP3_ADMIN_EMAIL"
  ADMIN_PASSWORD="$HOP3_ADMIN_PASSWORD"
  HOP3_PROXY_DENY='/application/commands /application/config /application/controllers /application/core /application/datavalueobjects /application/errors /application/exceptions /application/helpers /application/libraries /application/logs /application/models /application/views /docs /locale /open-api-gen.php /setdebug.php /tmp/runtime /tmp/upload /vendor/kcfinder/conf /vendor/kcfinder/core /vendor/kcfinder/doc /vendor/kcfinder/integration /vendor/kcfinder/lang /vendor/kcfinder/lib /vendor/kcfinder/tpl /vendor/tecnickcom/tcpdf/tools /vendor/yiisoft/yii/demos /vendor/yiisoft/yii/framework /vendor/yiisoft/yii/requirements'
volumes =
  upload upload

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
