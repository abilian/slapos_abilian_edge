# Hop3 Configuration for LimeSurvey (Native build)
# Professional online survey tool

[metadata]
id = "limesurvey-deny"
version = "6.16"
title = "LimeSurvey"
description = "Professional online survey and data collection tool"
homepage = "https://www.limesurvey.org/"
license = "GPL-2.0"
author = "LimeSurvey GmbH"
categories = ["surveys", "forms", "research", "data-collection"]

[build]
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
build = "composer install --no-dev --optimize-autoloader || true"

[run]
before-run = "bash scripts/setup-config.sh"

# nginx doesn't read LimeSurvey's .htaccess files, so these are their rules, with
# open-api-gen.php, which anyone could run and which writes to docs/. /application
# itself stays open: pages load two scripts from /application/extensions.
# One rule has no equivalent: upload/surveys denies fu_* files by pattern, and deny
# takes prefixes. A respondent's file stays readable by anyone who has its name.
[proxy]
deny = [
  "/application/commands", "/application/config", "/application/controllers",
  "/application/core", "/application/datavalueobjects", "/application/errors",
  "/application/exceptions", "/application/helpers", "/application/libraries",
  "/application/logs", "/application/models", "/application/views",
  "/docs", "/locale", "/open-api-gen.php", "/setdebug.php",
  "/tmp/runtime", "/tmp/upload",
  "/vendor/kcfinder/conf", "/vendor/kcfinder/core", "/vendor/kcfinder/doc",
  "/vendor/kcfinder/integration", "/vendor/kcfinder/lang", "/vendor/kcfinder/lib",
  "/vendor/kcfinder/tpl", "/vendor/tecnickcom/tcpdf/tools",
  "/vendor/yiisoft/yii/demos", "/vendor/yiisoft/yii/framework",
  "/vendor/yiisoft/yii/requirements",
]

[[addons]]
type = "postgres"

[env]
ADMIN_NAME = "Administrator"

# Generated admin credentials (ADR-056). The platform generates the password
# once (stable across redeploys), stores it encrypted, and injects
# HOP3_ADMIN_USER / HOP3_ADMIN_EMAIL / HOP3_ADMIN_PASSWORD into the runtime env.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

# Map LimeSurvey's installer env vars to the injected admin credentials.
# Interpolated after HOP3_ADMIN_* is injected, so these reach setup-config.sh.
[env.computed]
ADMIN_USER = "${HOP3_ADMIN_USER}"
ADMIN_EMAIL = "${HOP3_ADMIN_EMAIL}"
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
path = "/"
contains = "LimeSurvey"

# Every deploy replaces src/, so each directory the app writes to is a volume.
# upload/ holds what participants and admins upload (and survey themes): kept.
# tmp/ holds published assets and the Yii runtime: reset on every deploy.
[[volumes]]
name = "upload"
target = "upload"

[[volumes]]
name = "tmp"
target = "tmp"
type = "scratch"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "postgresql"]

[[test.validations]]
path = "/"
status = 200
contains = "LimeSurvey"
