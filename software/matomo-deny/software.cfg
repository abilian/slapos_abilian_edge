# Matomo 5.14.2, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../component/mariadb/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md 7c906543a4be5ab17d02d74e0bc4d1ed
  hop3.toml ba274237b6bd3a0c1301e20b1f2c703f
  scripts/download.sh 7ac62a07e618e7b90be33802c81b2ece
  scripts/install.php 23883fc0356a38885517dd29fd368e95
  scripts/setup-config.sh 4bc141ff8e58f61e9168f8d23ddc1d51
commands =
  bash scripts/download.sh
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = matomo-deny
eggs =
health = /
mariadb-bin = ${mariadb:location}/bin
secrets = HOP3_ADMIN_PASSWORD MATOMO_SALT:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@matomo-deny.invalid
  HOP3_PROXY_DENY='/CHANGELOG.md /CONTRIBUTING.md /DIObject.php /LEGALNOTICE /LICENSE /LegacyAutoloader.php /PRIVACY.md /README.md /SECURITY.md /config /console /core /hop3.toml /lang /misc /scripts /settings /tests /tmp /vendor'
volumes =
  settings settings

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
