# Hop3 Configuration for Nextcloud (Native build)
# File hosting and collaboration platform

[metadata]
id = "nextcloud-deny"
version = "35.0.2"
title = "Nextcloud"
description = "Self-hosted productivity platform"
homepage = "https://nextcloud.com/"
license = "AGPL-3.0"
author = "Nextcloud"
categories = ["file-sharing", "collaboration", "cloud-storage"]

[build]
# Force local builder
builder = "local"
# The PHP toolchain, which is what supplies the php-fpm pool that serves this.
# It used to be `generic`, which was accurate about the build — Nextcloud ships
# pre-built, nothing to install — but `generic` builds no web worker, so with
# no `start` line the app would have nothing serving it at all.
toolchain = "php"
# Nothing to build: the release tarball is complete. Without this the PHP
# toolchain would look for a composer.json to install from.
build = "true"

before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"

# The document root is the project root, and Nextcloud keeps its configuration,
# its libraries and every user's files beneath it (--data-dir is ./data). The
# upstream .htaccess refusing them is Apache's, so these are upstream's own
# nginx deny rules, minus the development files a release does not ship.
[proxy]
deny = [
  "/3rdparty", "/build", "/config", "/data", "/lib", "/templates", "/tests",
  "/occ", "/console.php",
  "/README.md", "/hop3.toml", "/scripts", "/AUTHORS", "/COPYING",
]

[[addons]]
type = "mysql"

# Hop3's OWN account for verifying the app keeps working. Deliberately NOT an
# admin: signing in is the whole diagnostic value, and a plain user carries a
# fraction of the privilege. Its password is Hop3's to rotate, so a refused
# sign-in means the app broke — unlike the [admin] credential, which stops being
# ours to assert the moment the operator changes it.
#
# Nextcloud's installer creates exactly one admin, so the probe is added
# afterwards with occ. OC_PASS is how `user:add` takes a password without a tty.
#
# No --email: this Nextcloud's `user:add` does not accept one (it answers with
# its usage line, which exits non-zero). The probe receives no mail, so it needs
# no address — and [probe].email is therefore left unset.
[probe]
username = "hop3probe"
create = '''
if ! php occ user:list --output=json | grep -q "\"$HOP3_PROBE_USER\""; then
  OC_PASS="$HOP3_PROBE_PASSWORD" php occ user:add --password-from-env \
    --display-name="Hop3 probe" "$HOP3_PROBE_USER"
fi
php occ user:list --output=json | grep -q "\"$HOP3_PROBE_USER\"" || {
  echo "Nextcloud probe account missing after user:add" >&2
  exit 1
}
'''

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Map the injected admin creds (HOP3_ADMIN_*) onto the env vars the installer
# (scripts/setup-config.sh -> occ maintenance:install) reads. Interpolated
# after the admin creds are injected, so no literal secret lives in [env].
[env.computed]
NEXTCLOUD_ADMIN_USER = "${HOP3_ADMIN_USER}"
NEXTCLOUD_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
path = "/status.php"
contains = "installed"

# Every deploy replaces src/, so each directory the app writes to is a volume.
# data/ holds every user's files; config/ holds config.php, which the
# installer writes and scripts/setup-config.sh reads to tell an installed
# server from a new one.
[[volumes]]
name = "data"
target = "data"

[[volumes]]
name = "config"
target = "config"

# Apps installed from the app store.
[[volumes]]
name = "custom_apps"
target = "custom_apps"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "nextcloud", "mysql"]

[[test.validations]]
path = "/status.php"
status = 200
contains = "installed"

# Exists, and without [proxy] deny php-fpm would run it and answer 200.
[[test.validations]]
path = "/config/config.php"
status = 404
