# Nextcloud 35.0.2, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../component/mariadb/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md 5860460e749bf39670279e30874cf51d
  hop3.toml ce9f4a4a6c567422c3ba63d698f10b59
  scripts/download.sh c33800d2a97a00754dbb719a47fdcf44
  scripts/setup-config.sh 84b5f7fade80dc54a10554fb8f5317d2
commands =
  bash scripts/download.sh
  true
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = nextcloud-deny
eggs =
health = /status.php
mariadb-bin = ${mariadb:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  NEXTCLOUD_ADMIN_USER="$HOP3_ADMIN_USER"
  NEXTCLOUD_ADMIN_PASSWORD="$HOP3_ADMIN_PASSWORD"
  HOP3_PROXY_DENY='/3rdparty /build /config /data /lib /templates /tests /occ /console.php /README.md /hop3.toml /scripts /AUTHORS /COPYING'
volumes =
  data data
  config config
  custom_apps custom_apps

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
