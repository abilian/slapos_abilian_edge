# Mynij proxy (github.com/abilian/mynij-proxy), on the python-app stack.
[buildout]
extends =
  ../../stack/python-app/buildout.cfg


[python3]
<= python3.13


[python-app]
name = mynij-proxy
repository = https://github.com/abilian/mynij-proxy.git
# The commit that builds offline.
revision = 22d945666aed14b0d562a0a11b269c842477ba8b
egg = mynij-proxy
eggs = gunicorn
scripts = gunicorn
port = 3001
health = /ping

[python-app-processes]
web = gunicorn --bind "[$HOST]:$PORT" -k uvicorn.workers.UvicornWorker -w 4 mynij_proxy:app


# httpx, anyio, h11, click, typing-extensions... are pinned in stack/slapos.cfg
[versions]
gunicorn = 26.2.0:whl
starlette = 1.10.0:whl
uvicorn = 0.54.0:whl
