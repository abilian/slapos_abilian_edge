[buildout]
extends =
# buildout.hash.cfg is used for automated hash calculation of managed
# instance files by calling update-hash
  buildout.hash.cfg
  ../../component/git/buildout.cfg
  ../../component/openssl/buildout.cfg
  ../../stack/slapos.cfg
  ../../stack/monitor/buildout.cfg

parts =
  slapos-cookbook
  mynij-proxy-develop
  mynij-proxy-eggs
  instance-profile


[python]
part = python3


[jinja-template]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}


[mynij-proxy-eggs]
recipe = zc.recipe.egg
# Scripts are only generated for the eggs listed here, not for their
# dependencies: gunicorn must be listed for bin/gunicorn to exist.
eggs =
  mynij-proxy
  gunicorn
scripts =
  gunicorn


[mynij-proxy-repository]
recipe = slapos.recipe.build:gitclone
repository = https://github.com/abilian/mynij-proxy.git
branch = main
revision = 22d945666aed14b0d562a0a11b269c842477ba8b
git-executable = ${git:location}/bin/git


[mynij-proxy-develop]
recipe = zc.recipe.egg:develop
setup = ${mynij-proxy-repository:location}


[instance-profile]
<= jinja-template
output = ${buildout:directory}/instance.cfg
extensions = jinja2.ext.do
context =
  section buildout buildout
  raw gunicorn_bin ${buildout:bin-directory}/gunicorn
  raw template_monitor ${monitor2-template:output}
  raw openssl_bin ${openssl:location}/bin/openssl


# httpx, anyio, h11, click, typing-extensions... are pinned in stack/slapos.cfg
[versions]
gunicorn = 26.2.0:whl
starlette = 1.10.0:whl
uvicorn = 0.54.0:whl
