# Forgejo 14.0.3, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/golang/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md 4c97ae18b7632d2193720a7cf4d64fbe
  hop3.toml 474238025b6e1c37866bc54c3977a237
  scripts/download.sh 56cac186959900d87c5928b59a6eed0e
  scripts/setup-config.sh 1ec47b0933f88cb9c742bbf9b9f11a80
  hop3-admin-create.sh 688cbe366016058a57a2bb5a44934ab5
commands =
  bash scripts/download.sh
  TAGS=bindata make backend forgejo
tools = ${golang1.26:location}/bin:${:base-tools}

[python-app]
name = forgejo-source
eggs =
health = /api/healthz
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD SECRET_KEY:base64 INTERNAL_TOKEN:hex JWT_SECRET:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=hop3admin
  HOP3_ADMIN_EMAIL=admin@forgejo-source.invalid
volumes =
  data data

[python-app-processes]
release = bash scripts/setup-config.sh
web = ./forgejo web
after-start = bash hop3-admin-create.sh
