# Dolibarr 19.0, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml e8fc299bb9342d48be985b5c10dbd13b
  scripts/download.sh 13ba621ce2103419bf5022e3938a795a
  scripts/setup-config.sh c0be8bfccbfc7d56e133f942421af160
commands =
  bash scripts/download.sh
  composer install --no-dev --optimize-autoloader || true
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = dolibarr
eggs =
health = /
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
volumes =
  documents documents

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
