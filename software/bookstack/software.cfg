# BookStack 24.02, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../component/mariadb/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg
  ../../stack/hop3/composer.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml fd1505d49e7280c6cab181636b781f0a
  scripts/download.sh cf28879a928a6dcbcb0bc2506e9c9f34
  scripts/setup-config.sh e90867528aa37796ad80a170df704b1f
commands =
  bash scripts/download.sh
  composer install --no-dev --optimize-autoloader
tools = ${hop3-composer:location}:${hop3-php:tools}:${:base-tools}

[python-app]
name = bookstack
eggs =
health = /login
mariadb-bin = ${mariadb:location}/bin
secrets = HOP3_ADMIN_PASSWORD HOP3_SECRET_APP_KEY:base64
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_BACKEND_URL=$${app-parameters:url}
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@bookstack.invalid
  APP_ENV=production
  APP_DEBUG=false
  APP_KEY="base64:$HOP3_SECRET_APP_KEY"
volumes =
  attachments storage/uploads
  images public/uploads
  app-files storage/app
  sessions storage/framework/sessions
  logs storage/logs

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
