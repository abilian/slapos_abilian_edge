# Hop3 Configuration for BookStack (Native build)
# Documentation/wiki platform

[metadata]
id = "bookstack"
version = "24.02"
title = "BookStack"
description = "Simple, self-hosted documentation platform"
homepage = "https://www.bookstackapp.com/"
license = "MIT"
author = "BookStackApp"
categories = ["wiki", "documentation", "knowledge-base"]

[build]
# Force local builder and explicit PHP toolchain to avoid multi-language artifact
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
build = "composer install --no-dev --optimize-autoloader"

[run]
before-run = "bash scripts/setup-config.sh"

[[addons]]
type = "mysql"

# ADR-056 admin bootstrap. BookStack keys admins by email; the generated
# credentials are surfaced once in the deploy log and retrievable via
# `hop3 app credentials --app bookstack`. HOP3_ADMIN_USER/EMAIL/PASSWORD are
# injected into the app runtime env and consumed by scripts/setup-config.sh,
# which resets BookStack's migration-seeded default admin (admin@admin.com).
[admin]
# BookStack authenticates by EMAIL; `username` is only the display name, so an
# operator handed both and left to guess picks the username and is rejected.
login = "email"
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[env]
APP_ENV = "production"
APP_DEBUG = "false"
# ADR-046: stable, generated-once Laravel APP_KEY. BookStack encrypts data with
# it (MFA/2FA secrets, sessions), so it must NOT rotate on redeploy. The platform
# generates it once and re-injects the same value every deploy; setup-config.sh
# consumes ${APP_KEY} instead of minting a fresh key. Laravel needs base64: +
# 32 decoded bytes (AES-256-CBC) -> base64 generator, length = 32.
APP_KEY = { generate = "base64", length = 32, prefix = "base64:" }

[healthcheck]
path = "/login"
contains = "BookStack"

# Every deploy replaces src/, so each directory the app writes to is a volume.
# Kept: what users upload, their sessions, the logs. Reset on every deploy:
# Laravel's compiled views, its cache and its bootstrap cache, which belong to
# one version (compiled views are reused whenever they look newer than their
# source, and an upgrade's source is older than the last compile).
# BookStack keeps attachments in storage/uploads and images in public/uploads.
[[volumes]]
name = "attachments"
target = "storage/uploads"

[[volumes]]
name = "images"
target = "public/uploads"

[[volumes]]
name = "app-files"
target = "storage/app"

[[volumes]]
name = "sessions"
target = "storage/framework/sessions"

[[volumes]]
name = "logs"
target = "storage/logs"

[[volumes]]
name = "views"
target = "storage/framework/views"
type = "scratch"

[[volumes]]
name = "cache"
target = "storage/framework/cache"
type = "scratch"

[[volumes]]
name = "bootstrap-cache"
target = "bootstrap/cache"
type = "scratch"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "laravel", "mysql"]

[[test.validations]]
path = "/login"
status = 200
contains = "BookStack"
