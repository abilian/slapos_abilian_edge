# Mattermost 9.4.2, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/golang/buildout.cfg
  ../../component/nodejs/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[nodejs]
<= nodejs-24.11.0

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md 4719d404fb2370009871d2f9199fa137
  hop3.toml 6b9ff7b51ffafed073a6df29411d71f0
  scripts/download.sh c26960e6e6025ad764fd13eac4f3b58e
  scripts/setup-config.sh 0ff31ef44a84a42416efd5497d50fd37
  hop3-admin-create.sh 5d5e7fc36057b815768588250448b0f5
commands =
  bash scripts/download.sh
  npm --prefix webapp ci --include=dev --ignore-scripts --no-engine-strict
  sed -i "s/config.devtool = 'source-map';/config.devtool = false;/" webapp/channels/webpack.config.js
  sed -i '/image-webpack-loader/{n;s/options: {}/options: {disable: true}/}' webapp/channels/webpack.config.js
  NODE_OPTIONS=--max-old-space-size=3072 npm --prefix webapp run build
  go -C server work init
  go -C server work use . ./public
  go -C server build -trimpath -buildvcs=false -tags production -ldflags '-X github.com/mattermost/mattermost/server/public/model.BuildNumber=9.4.2 -X github.com/mattermost/mattermost/server/public/model.BuildEnterpriseReady=false' -o ../bin/ ./cmd/mattermost ./cmd/mmctl
  cp -RL server/fonts server/templates server/i18n .
  cp -RL webapp/channels/dist/. client/
  rm -rf webapp server e2e-tests api tools
tools = ${golang1.23:location}/bin:${nodejs:location}/bin:${:base-tools}

[python-app]
name = mattermost-source
eggs =
health = /api/v4/system/ping
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD MM_ATRESTKEY:base64
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@mattermost-source.invalid
volumes =
  data data

[python-app-processes]
release = bash scripts/setup-config.sh
web = ./bin/mattermost
after-start = bash hop3-admin-create.sh
