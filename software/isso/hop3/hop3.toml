# Hop3 Configuration for Isso (Native build)
# Lightweight commenting system

[metadata]
id = "isso"
version = "0.14.0"
title = "Isso"
description = "A lightweight commenting system, Disqus alternative"
homepage = "https://isso-comments.de/"
license = "MIT"
author = "Isso Comments"
categories = ["comments", "blog", "community"]

[build]
builder = "local"
toolchain = "python"

# The JS bundles must exist BEFORE the Python install packages them, so they are
# built here rather than in `[build].build`. (This recipe predates the platform
# honouring that key — it was ignored in 7 of 12 toolchains — but before-build is
# the right home regardless, because the ordering is what matters.)
before-build = [
  "bash scripts/download.sh",
  "npm ci",
  "npm run build-prod",
]
# Isso serves an embeddable widget at /js/embed.min.js — that is the whole point
# of the app — and those bundles are BUILD OUTPUTS, absent from the source tree.
# `pip install .` alone packaged only the one committed script (admin.js), so
# every /js/* path 404'd and the comment widget could not be embedded anywhere.
# webpack (build-prod) emits the .min.js bundles; npm ci installs exactly the
# committed package-lock.json.
# NOTE: [build].build is currently a no-op — the platform parses it and never
# runs it — so nothing that matters may live here. The Python toolchain performs
# the `pip install .` step itself.
# The bundles are invisible at deploy time — isso still starts and /admin/ still
# works — so a missing widget would only surface on someone else's site. Assert
# the build produced it.
after-build = "test -f isso/js/embed.min.js || { echo 'isso JS build produced no embed.min.js (npm run build-prod failed silently?)' >&2; exit 1; }"

[run]
before-run = "bash scripts/setup-config.sh"
start = "isso -c isso.cfg"

# Isso stores all comments in a single SQLite database (dbpath = data/comments.db
# in isso.cfg). That path lives under the source tree, which a redeploy wipes and
# re-extracts — so without persistence every redeploy destroys ALL comments.
# ADR 046 §2: back the `data/` directory with a persistent volume so the SQLite
# db survives the source-replacing redeploy. The volume is symlinked into src/
# before before-build/before-run run, so `mkdir -p data` in the scripts is a
# harmless no-op and isso writes comments.db straight into persistent storage.
[[volumes]]
name = "data"
target = "data"

# ADR-056: generate the admin password once (stable across redeploys, retrievable
# via `hop3 app credentials`) and inject HOP3_ADMIN_PASSWORD into the runtime.
# Isso's moderation/admin dashboard is PASSWORD-ONLY: there is no admin username
# and no admin email. Hop3's [admin] schema still needs an identity, so we set a
# nominal username that isso ignores. There is no [admin].create command — isso
# has no user store to seed; scripts/setup-config.sh maps HOP3_ADMIN_PASSWORD
# into isso.cfg [admin].password (re-templated every deploy) and enables the
# moderation queue, so out of the box no anonymous comment self-publishes.
# NO [probe] section, deliberately. Isso has no user model — its admin is a
# single moderation password with no accounts to create — so there is nothing
# Hop3 can own separately. Its check therefore signs in with that password and
# verifies the handover only, and says so rather than implying more.

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# `/` is isso's comment API, which answers 400 "missing uri query" without a
# uri parameter — correct behaviour, but useless as a health signal. The admin
# page is the app's only real page.
[healthcheck]
path = "/admin/"
contains = "Administration secured by password"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "isso"]

[[test.validations]]
path = "/"
status = 400
contains = "missing uri query"

# Admin dashboard is enabled AND password-protected: GET /admin/ renders the
# login form ("Administration secured by password") when not authenticated.
# With the admin interface disabled it would instead serve disabled.html, so
# this asserts the [admin] config actually took effect.
[[test.validations]]
path = "/admin/"
status = 200
contains = "Administration secured by password"
