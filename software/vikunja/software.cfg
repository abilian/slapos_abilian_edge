# Vikunja 0.x, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
# Provisional: runs the binary the recipe fetches, where a SlapOS release builds
# from source. To replace with a port of a variant of the recipe that does.
[buildout]
extends =
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml 93d68401469b6705bdd9d87b2a0a0ab4
  scripts/download.sh e8d5271c78a73a53b3b01ac708891b66
  scripts/setup-config.sh 2b356c26b8d2abe45bb03c9f82c87904
  hop3-admin-create.sh a21350b68a061914f9a3bb9b282eb520
commands =
  bash scripts/download.sh

[python-app]
name = vikunja
eggs =
health = /api/v1/info
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD JWT_SECRET:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@vikunja.invalid
volumes =
  files files

[python-app-processes]
release = bash scripts/setup-config.sh && bash hop3-admin-create.sh
web = ./vikunja
