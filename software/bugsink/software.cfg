# Bugsink 2.1.2, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ./versions.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml 58e08e315c812dc1f53057d8c7245e05
  requirements.in 6bb8c9947d3d97a6dc6c22fda672a763
  requirements.txt 3967980029ddddb78e0d2f8905b50003
  scripts/setup.sh fcefa574435fa4a4dc25e5cedb5d0e67
commands =

[python-app]
name = bugsink
eggs =
  asgiref
  attrs
  brotli
  bugsink
  certifi
  cffi
  charset-normalizer
  django
  django-admin-autocomplete-filter
  django-tailwind
  djangorestframework
  drf-spectacular
  drf-spectacular-sidecar
  ecma426
  fastjsonschema
  gunicorn
  idna
  inflection
  inotify-simple
  jsonschema
  jsonschema-specifications
  milksnake
  monofy
  packaging
  psycopg2-binary
  pycparser
  pygments
  python-dateutil
  pyyaml
  referencing
  requests
  rpds-py
  semver
  sentry-sdk
  six
  sqlparse
  symbolic
  typing-extensions
  ua-parser
  ua-parser-builtins
  uritemplate
  urllib3
  user-agents
  verbose-csrf-middleware
  whitenoise
health = /accounts/login/
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD SECRET_KEY:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@bugsink.invalid

[python-app-processes]
release = bash scripts/setup.sh
web = gunicorn bugsink.wsgi:application --bind 0.0.0.0:$PORT --pythonpath . --access-logfile - --error-logfile - --no-control-socket
snappea = bugsink-runsnappea
