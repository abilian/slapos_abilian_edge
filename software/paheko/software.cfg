# Paheko 1.3.15, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/apache-php/buildout.cfg
  ../../component/nginx/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/hop3/php.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml cd6e4a297f0a483ba847eb9e7c1a4889
  scripts/download.sh cada79f26f6d73b5409ebe42efd3774f
  scripts/setup-config.sh ded0b6f400363b36abe397504a2f4d1a
commands =
  bash scripts/download.sh
  true
tools = ${hop3-php:tools}:${:base-tools}

[python-app]
name = paheko
eggs =
health = /admin/login.php
secrets = HOP3_ADMIN_PASSWORD PAHEKO_SECRET_KEY:base64
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  PHPRC=${hop3-php-ini:output}
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@paheko.invalid
  PAHEKO_COUNTRY=FR
  PAHEKO_ORG_NAME=Paheko
volumes =
  data data

[python-app-processes]
fpm = hop3-php-fpm
web = hop3-php-web
release = bash scripts/setup-config.sh
