# Uptime Kuma 2.4.0, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/nodejs/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[nodejs]
<= nodejs-24.11.0

[nodejs-headers]
<= nodejs-headers-24.11.0

# Native modules from their source, where npm would fetch a prebuilt binary.
[python-app-git]
environment +=
  npm_config_build_from_source=true
  npm_config_tarball=${nodejs-headers:target}
  NODE_GYP_FORCE_PYTHON=${python3:location}/bin/python3

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml a98730be7fa11d2d995fc8cee8f38c3f
  scripts/create-admin.js 8be937c5595e2b16f13015411f00cabb
  scripts/create-probe.js d4edf0350d13b0f491867c4330832a00
  scripts/download.sh 13bdfcae2f67942f8b10d2592bebc01d
  scripts/probe.js 41e3c0b9418731fbcca5d59bf96cdc79
  scripts/setup-config.sh 9a0e5408ae607fd5e289c2262bc99bb2
commands =
  bash scripts/download.sh
  npm ci
  npm run build
  test -d dist && test -n "$(ls -A dist)" || { echo 'Uptime Kuma frontend build produced no dist/ (npm run build failed silently?)' >&2; exit 1; }
tools = ${nodejs:location}/bin:${gcc:prefix}/bin:${binutils:location}/bin:${:base-tools}

[python-app]
name = uptime-kuma
eggs =
health = /dashboard
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  DATA_DIR=./data/
  NODE_ENV=production
volumes =
  data data

[python-app-processes]
release = bash scripts/setup-config.sh
web = node server/server.js
