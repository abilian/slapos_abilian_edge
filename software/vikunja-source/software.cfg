# Vikunja 0.24.6, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/golang/buildout.cfg
  ../../component/nodejs/buildout.cfg
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[nodejs]
<= nodejs-24.11.0

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  README.md fa706292f18f5482cd95bc1872c0483c
  hop3.toml ea1cecf2e6635d8750bffecd39ffa395
  scripts/download.sh 15fd8fa005327ef8c7fd0aa13d4907db
  scripts/setup-config.sh 2b356c26b8d2abe45bb03c9f82c87904
  hop3-admin-create.sh a21350b68a061914f9a3bb9b282eb520
commands =
  bash scripts/download.sh
  npx pnpm@9.10.0 --dir frontend install --frozen-lockfile --ignore-scripts
  NODE_OPTIONS=--max-old-space-size=3072 npx pnpm@9.10.0 --dir frontend run build
  go build -ldflags '-s -w -X code.vikunja.io/api/pkg/version.Version=v0.24.6' -o vikunja .
  rm -rf frontend/node_modules
tools = ${golang1.23:location}/bin:${nodejs:location}/bin:${:base-tools}

[python-app]
name = vikunja-source
eggs =
health = /api/v1/info
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD JWT_SECRET:urlsafe
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  HOP3_ADMIN_EMAIL=admin@vikunja-source.invalid
volumes =
  files files

[python-app-processes]
release = bash scripts/setup-config.sh
web = ./vikunja
after-start = bash hop3-admin-create.sh
