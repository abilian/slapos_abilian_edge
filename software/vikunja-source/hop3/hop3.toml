# Hop3 Configuration for Vikunja (Native build)
# Open source task/project management

[metadata]
id = "vikunja-source"
version = "0.24.6"
title = "Vikunja"
description = "Open source task and project management"
homepage = "https://vikunja.io/"
license = "AGPL-3.0"
author = "Vikunja"
categories = ["project-management", "task-management", "kanban"]

[build]
builder = "local"
# The native entry runs the binary Vikunja publishes. This variant builds it, for
# platforms that build everything they run from source.
toolchain = "go"

# Download the source
before-build = "bash scripts/download.sh"

# The frontend first: the binary embeds frontend/dist. --ignore-scripts skips the
# download of Cypress's binary, which only the frontend's tests use. The PostgreSQL
# driver is pure Go, so without a C compiler only SQLite is left out, which isn't used.
# Vite needs more than Node's default heap, about 2 GB on a machine of 8 GB.
# node_modules goes at the end: the binary has what it needs, and it is 544 MB.
build = [
  "npx pnpm@9.10.0 --dir frontend install --frozen-lockfile --ignore-scripts",
  "NODE_OPTIONS=--max-old-space-size=3072 npx pnpm@9.10.0 --dir frontend run build",
  "go build -ldflags '-s -w -X code.vikunja.io/api/pkg/version.Version=v0.24.6' -o vikunja .",
  "rm -rf frontend/node_modules",
]

[run]
before-run = "bash scripts/setup-config.sh"
start = "./vikunja"

# ADR 046: a stable, generated-once JWT signing secret. Vikunja mints a RANDOM
# service.JWTSecret at every startup when it's unset, which invalidates every
# issued token on each restart/redeploy (all users logged out). The platform
# generates this once, persists it, and re-injects the SAME value each redeploy;
# setup-config.sh writes it into config.yml as service.jwtsecret so sessions
# survive redeploys.
[env]
JWT_SECRET = { generate = "urlsafe" }

[[addons]]
type = "postgres"

# ADR 046 §2: Vikunja stores task attachments and other uploads under
# files.basepath (./files, relative to the binary, i.e. inside src/). A redeploy
# wipes and re-extracts src/, so without a persistent volume every uploaded file
# is lost on redeploy. Persist ./files outside src/ (<app>/volumes/files) so it
# survives. The postgres addon already covers the relational data.
[[volumes]]
name = "files"
target = "files"

# ADR-056: provision the initial admin instead of letting the first visitor
# self-register into an open instance. The platform generates the password once
# (stable across redeploy, retrievable via `hop3 app credentials`), resolves the
# email, and injects HOP3_ADMIN_USER/EMAIL/PASSWORD into the app runtime.
# Vikunja does NOT reserve the name "admin" (unlike Gitea), so we use it. Its
# admins are keyed by username; the email is a required, format-validated field.
# Hop3's OWN account for verifying the app keeps working — a plain user, not an
# admin. Its password is Hop3's to rotate, so a refused sign-in means the app
# broke, unlike the [admin] credential once the operator changes it.
[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
if ! ./vikunja user list 2>/dev/null | grep -q "$HOP3_PROBE_USER"; then
  ./vikunja user create --username "$HOP3_PROBE_USER" \
    --email "$HOP3_PROBE_EMAIL" --password "$HOP3_PROBE_PASSWORD"
fi
./vikunja user list 2>/dev/null | grep -q "$HOP3_PROBE_USER" || {
  echo "Vikunja probe account missing after user create" >&2
  exit 1
}
'''

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
# Runs once, post-deploy, in src/ (the app has started and migrated the DB by
# then) with HOP3_ADMIN_* + the postgres addon's PG* vars in the env. Vikunja's
# `user create` reads config.yml from the cwd, and `-p` makes it non-interactive
# (without it, the CLI PROMPTS and would hang). `user create` errors (exit != 0)
# on a duplicate username, so guard it with an idempotent presence check parsing
# the Username column (field 3) of `user list` — grep -Fxq gives an exact match
# that can't false-hit an address in the Email column. A final presence check
# fails the deploy loudly if the account still isn't there.
create = '''
set -eu
ADMIN_USER="${HOP3_ADMIN_USER:?admin user not injected}"
ADMIN_EMAIL="${HOP3_ADMIN_EMAIL:?admin email not injected}"
ADMIN_PASSWORD="${HOP3_ADMIN_PASSWORD:?admin password not injected}"
present() {
  ./vikunja user list 2>/dev/null \
    | awk -F'|' 'NF>=4 { gsub(/^[ \t]+|[ \t]+$/, "", $3); print $3 }' \
    | grep -Fxq "$ADMIN_USER"
}
if present; then
  echo "Vikunja admin already exists: $ADMIN_USER"
else
  ./vikunja user create -u "$ADMIN_USER" -e "$ADMIN_EMAIL" -p "$ADMIN_PASSWORD"
fi
present || { echo "ERROR: Vikunja admin '$ADMIN_USER' was not created" >&2; exit 1; }
'''

[healthcheck]
path = "/api/v1/info"
contains = "\"registration_enabled\":false"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "postgresql"]

# /api/v1/info echoes the effective config as JSON. Assert registration is
# actually CLOSED (not just that the app is up) — proves the ADR-056 disable
# took effect. Go's compact json.Marshal emits no space after the colon.
[[test.validations]]
path = "/api/v1/info"
status = 200
contains = '"registration_enabled":false'

[[test.validations]]
path = "/"
status = 200
contains = "Vikunja"
