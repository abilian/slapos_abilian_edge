# AIPress24 (github.com/aipress24/aipress24), on the python-app stack: what
# follows is what this app adds to it.
[buildout]
# Components first: one of them sets [buildout] parts, and the stack's must be
# the one `parts +=` adds to. versions.cfg last, over SlapOS's pins.
extends =
  ../../component/postgresql/buildout.cfg
  ../../component/file/buildout.cfg
  ../../component/gtk/buildout.cfg
  ../../component/fontconfig/buildout.cfg
  ../../component/fonts/buildout.cfg
  ../../stack/python-app/buildout.cfg
  ./versions.cfg

parts +=
  postgresql
  pango
  file
  fontconfig
  aipress24-data


[python3]
<= python3.13


[python-app]
name = aipress24
repository = https://github.com/aipress24/aipress24.git
branch = slapos
egg = aipress24-flask
setup-eggs = pdm-backend
eggs =
  ${psycopg-c:egg}
  gunicorn
  flask
  dramatiq
scripts =
  gunicorn
  flask
  dramatiq
port = 8024
# It queries the users table: the app and its database are up.
health = /system/health
# As hop3.toml's [env] generate: never rotated (the salt hashes the passwords).
secrets =
  FLASK_SECRET_KEY
  FLASK_SECURITY_PASSWORD_SALT
postgresql-bin = ${postgresql:location}/bin
# What WeasyPrint and python-magic load at run time, and libpq.
library-path = ${pango:location}/lib:${cairo:location}/lib:${harfbuzz:location}/lib:${fribidi:location}/lib:${glib:location}/lib:${fontconfig:location}/lib:${freetype:location}/lib:${file:location}/lib:${postgresql:location}/lib
fonts =
  ${liberation-fonts:location}
  ${dejavu-fonts:location}
fontconfig-includes = ${fontconfig:location}/etc/fonts/conf.d
fonts-conf = ${template-fonts-conf:output}
# Dynaconf maps FLASK_* over etc/settings.toml; the app reads DATABASE_URL itself.
environment =
  FLASK_SERVER_NAME=$DOMAIN
  FLASK_PREFERRED_URL_SCHEME=https

# The Procfile's, except web (gunicorn, not granian) and worker: `flask queue
# worker` runs `python -m dramatiq` with the bare interpreter, which doesn't have
# the eggs. release: schema from the models on an empty database, stamped at
# Alembic's head (as Hop3's blank deploy), then the data and the first admin.
[python-app-processes]
web = gunicorn -b "[$HOST]:$PORT" -w 2 --timeout 180 "app.flask.main:create_app()"
worker = dramatiq app.dramatiq.worker_entry --processes 1 --threads 4
scheduler = flask queue scheduler
release = app-python scripts/hop3_db_bootstrap.py && flask bootstrap && flask data bootstrap-users


# The data `flask bootstrap` loads, where the app looks for it (bootstrap_data/ in
# its checkout). The app would clone it itself, into a release that is read-only
# at run time.
[aipress24-data]
recipe = slapos.recipe.build:gitclone
repository = https://github.com/aipress24/aipress24-data.git
revision = eb4140b63ccdbd8955a68327f1518dd07a8192c0
location = ${python-app-git:location}/bootstrap_data
git-executable = ${git:location}/bin/git


# Built against the node's libpq (psycopg[c]), with pg_config from PostgreSQL.
# The patch gives its license in the form SlapOS's setuptools (74) reads.
[psycopg-c]
recipe = zc.recipe.egg:custom
egg = psycopg-c
setup-eggs =
  cython
environment = psycopg-c-env
rpath = ${postgresql:location}/lib
psycopg-c-patches = ${:_profile_base_location_}/psycopg-c-setuptools74-license.patch#05a4a1205e129ec3e94bbc01f32b56aa
psycopg-c-patch-options = -p1

[psycopg-c-env]
PATH = ${postgresql:location}/bin:%(PATH)s


[versions]
# Build-time only, so not in the app's uv.lock.
pdm-backend = 2.5.0:whl
# SlapOS's stack builds these itself, from source (slapos-cookbook): no :whl,
# and lxml and cffi at its versions, which fit the app's constraints.
lxml = 6.1.2
cffi = 2.1.1
pyyaml = 6.0.3
