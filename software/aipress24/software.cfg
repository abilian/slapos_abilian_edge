[buildout]
extends =
    ../../component/defaults.cfg
    ../../stack/slapos.cfg
    ../../stack/monitor/buildout.cfg
    ../../component/postgresql/buildout.cfg
    ../../component/git/buildout.cfg
    ../../component/dash/buildout.cfg
    ../../component/file/buildout.cfg
    ../../component/gtk/buildout.cfg
    ../../component/fontconfig/buildout.cfg
    ../../component/fonts/buildout.cfg
    ./versions.cfg
    ./buildout.hash.cfg

parts =
    slapos-cookbook
    postgresql
    pango
    file
    fontconfig
    aipress24-eggs
    instance


[python3]
<= python3.13


[aipress24-git]
recipe = slapos.recipe.build:gitclone
repository = https://github.com/aipress24/aipress24.git
branch = slapos
git-executable = ${git:location}/bin/git


[aipress24-develop]
recipe = zc.recipe.egg:develop
setup = ${aipress24-git:location}
setup-eggs =
    pdm-backend
egg = aipress24-flask


# Built against the node's libpq (psycopg[c]), with pg_config from PostgreSQL.
# The patch gives its license in the form SlapOS's setuptools (74) reads.
[psycopg-c]
recipe = zc.recipe.egg:custom
egg = psycopg-c
setup-eggs =
    cython
environment = psycopg-c-env
rpath = ${postgresql:location}/lib
psycopg-c-patches = ${:_profile_base_location_}/psycopg-c-setuptools74-license.patch#05a4a1205e129ec3e94bbc01f32b56aa
psycopg-c-patch-options = -p1

[psycopg-c-env]
PATH = ${postgresql:location}/bin:%(PATH)s


# versions.cfg is `hox versions` on the app's uv.lock: packages with a wheel for
# the node come from it, psycopg-c is built above.
[aipress24-eggs]
recipe = zc.recipe.egg
eggs =
    ${psycopg-c:egg}
    ${aipress24-develop:egg}
    gunicorn
    flask
scripts =
    gunicorn
    flask
# pdm-backend's editable install is a .pth file, which buildout's scripts don't read.
extra-paths =
    ${aipress24-git:location}/src
# For the bootstrap script, run from the app's checkout.
interpreter = aipress24-python


[instance]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg
context =
    section buildout buildout
    raw bin_directory ${buildout:bin-directory}
    key app_directory aipress24-git:location
    raw dash ${dash:location}/bin/dash
    raw git_bin ${git:location}/bin
    raw postgresql_bin ${postgresql:location}/bin
    raw template_monitor ${monitor2-template:output}
    raw template_fonts_conf ${template-fonts-conf:output}
    raw fontconfig_includes ${fontconfig:location}/etc/fonts/conf.d
    raw fonts ${liberation-fonts:location} ${dejavu-fonts:location}
    raw library_path ${pango:location}/lib:${cairo:location}/lib:${harfbuzz:location}/lib:${fribidi:location}/lib:${glib:location}/lib:${fontconfig:location}/lib:${freetype:location}/lib:${file:location}/lib:${postgresql:location}/lib


[versions]
# Build-time only, so not in the app's uv.lock.
pdm-backend = 2.5.0:whl
# SlapOS's stack builds these itself, from source (slapos-cookbook): no :whl,
# and lxml and cffi at its versions, which fit the app's constraints.
lxml = 6.1.2
cffi = 2.1.1
pyyaml = 6.0.3
