# Isso 0.14.0, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../component/nodejs/buildout.cfg
  ../../component/libffi/buildout.cfg
  ../../stack/hop3/buildout.cfg
  ../../stack/python-app/venv.cfg
  ../../stack/hop3/venv.cfg

[python3]
<= python3.13

[nodejs]
<= nodejs-24.11.0

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml 6f60cf726407663de161e7510e3d676f
  scripts/download.sh bfadeecdef27f20a3330551c925c26b3
  scripts/setup-config.sh f668be15ad02456cce7e81f20e757c82
commands =
  bash scripts/download.sh
  npm ci
  npm run build-prod
  test -f isso/js/embed.min.js || { echo 'isso JS build produced no embed.min.js (npm run build-prod failed silently?)' >&2; exit 1; }
tools = ${nodejs:location}/bin:${:base-tools}

[python-app-requirements]
url = ${:_profile_base_location_}/requirements.txt
md5sum = 2fc3dfe9567360635a64102192c308c6

[python-app]
name = isso
egg = isso
no-binary = cffi markupsafe
build-libraries = ${libffi:location}
uploaded-prior-to = 2026-11-04T21:08:30Z
health = /admin/
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
volumes =
  data data

[python-app-processes]
release = bash scripts/setup-config.sh
web = isso -c isso.cfg
