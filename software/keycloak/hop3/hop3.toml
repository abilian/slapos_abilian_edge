# Hop3 Configuration for Keycloak (Native build)
# Enterprise SSO / OIDC / SAML identity provider

[metadata]
id = "keycloak"
version = "26.1.4"
title = "Keycloak"
description = "Enterprise SSO / OIDC / SAML identity and access management"
homepage = "https://www.keycloak.org/"
license = "Apache-2.0"
author = "Keycloak"
categories = ["auth", "sso", "identity"]

[build]
builder = "local"
toolchain = "generic"
# Download Keycloak tarball AND a JDK 21 runtime. The second half is
# a workaround for DEFERRED-APPS.md blocker #1 (`[build].packages`
# parsed but unconsumed) + the installer shipping `default-jdk` which
# is JDK 17 on bookworm but Keycloak 26 requires JDK 21.
# If blocker #1 ships, we could declare `packages = ["openjdk-21-jdk"]`
# here and drop the JDK-download step.
before-build = "bash scripts/download.sh"

[run]
start = "bash scripts/start.sh"
# Keycloak start-dev on a cold JVM + cold Postgres does provider
# install, theme cache, and schema migrations; 2-4 min is normal.
start-timeout = 420

[[addons]]
type = "postgres"

# ADR-056: generate the temporary bootstrap admin password once (stable across
# redeploys), inject HOP3_ADMIN_USER/HOP3_ADMIN_PASSWORD into the app runtime.
# Keycloak's bootstrap admin is keyed by username only — no email field.
# Hop3's OWN account for verifying the app keeps working — a plain realm user
# with no role mappings, not an admin. Its password is Hop3's to rotate, so a
# refused sign-in means the app broke, unlike the [admin] credential once the
# operator changes it.
[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
# kcadm.sh finds Java as kc.sh does: the JRE download.sh unpacked, if any.
if [ -d "$PWD/jre" ]; then
  export JAVA_HOME="$PWD/jre"
  export PATH="$JAVA_HOME/bin:$PATH"
fi
kcadm=keycloak/bin/kcadm.sh
"$kcadm" config credentials --server http://localhost:${PORT:-8080} \
  --realm master --user "$HOP3_ADMIN_USER" --password "$HOP3_ADMIN_PASSWORD"
if ! "$kcadm" get users -r master -q username="$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER"; then
  "$kcadm" create users -r master -s username="$HOP3_PROBE_USER" \
    -s email="$HOP3_PROBE_EMAIL" -s enabled=true
  "$kcadm" set-password -r master --username "$HOP3_PROBE_USER" \
    --new-password "$HOP3_PROBE_PASSWORD"
fi
"$kcadm" get users -r master -q username="$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER" || {
  echo "Keycloak probe user missing after create" >&2
  exit 1
}
'''

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Map the injected admin creds onto the env vars Keycloak 26 reads at first
# start to create the temporary admin (KC_BOOTSTRAP_ADMIN_*). Interpolated
# after the admin creds are injected, so no literal secret lives in [env].
[env.computed]
KC_BOOTSTRAP_ADMIN_USERNAME = "${HOP3_ADMIN_USER}"
KC_BOOTSTRAP_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
path = "/realms/master"
contains = "master"

# `start-dev` re-augments Keycloak on every start, writing into lib/quarkus.
# Every deploy replaces src/, so that is a scratch volume: writable, reset
# to what the distribution ships on each deploy. Everything Keycloak keeps is
# in PostgreSQL.
[[volumes]]
name = "quarkus"
target = "keycloak/lib/quarkus"
type = "scratch"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "jvm", "native", "postgres", "sso"]

[[test.validations]]
path = "/realms/master"
status = 200
contains = "master"
