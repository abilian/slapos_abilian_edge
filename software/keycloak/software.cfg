# Keycloak 26.1.4, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
# Provisional: runs the binary the recipe fetches, where a SlapOS release builds
# from source. To replace with a port of a variant of the recipe that does.
[buildout]
extends =
  ../../component/postgresql/buildout.cfg
  ../../stack/hop3/buildout.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml 52cf5906dfeafa272848a474c1f7b738
  scripts/download.sh 930784f79cb136492eb9703d29084039
  scripts/start.sh 2926a1879deeb3aa640138714abef4e7
commands =
  bash scripts/download.sh

[python-app]
name = keycloak
eggs =
health = /realms/master
postgresql-bin = ${postgresql:location}/bin
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
  KC_BOOTSTRAP_ADMIN_USERNAME="$HOP3_ADMIN_USER"
  KC_BOOTSTRAP_ADMIN_PASSWORD="$HOP3_ADMIN_PASSWORD"

[python-app-processes]
web = bash scripts/start.sh
