# Radicale 3.2.3, from its Hop3 recipe in hop3/,
# by `hox port`: change the recipe and port it again rather than edit this file.
[buildout]
extends =
  ../../stack/hop3/buildout.cfg
  ./versions.cfg

[python3]
<= python3.13

[hop3]
base = ${:_profile_base_location_}/hop3
files =
  hop3.toml 4fc470fbf1e80d3b7edc111755b71654
  requirements.txt dd1c2d4fc1a2fac4ca0e75de54ef7664
  scripts/download.sh 4bef83ccdb4ff004e318afe78d6e30a0
  scripts/setup-config.sh be51331803308f113cb574c32bf8ce3c
commands =
  bash scripts/download.sh

[python-app]
name = radicale
eggs =
  Radicale
  bcrypt
  defusedxml
  passlib
  pika
  python-dateutil
  pytz
  six
  vobject
health = /.web/
secrets = HOP3_ADMIN_PASSWORD
environment =
  HOST_NAME=$DOMAIN
  HOP3_PUBLIC_URL=$URL
  HOP3_ADMIN_USER=admin
volumes =
  collections collections
  auth auth

[python-app-processes]
release = bash scripts/setup-config.sh
web = python -m radicale --config config
