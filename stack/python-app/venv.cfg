# The app in a venv of its own, installed by pip from hash-checked pins, in
# place of buildout's eggs: SlapOS's setuptools and pip don't touch it. A release
# extends this file after the stack: see README.md.
[buildout]
parts +=
  python-app-venv
parts -=
  python-app-eggs


[python-app]
# Packages with a compiled wheel, built from their sdist: pure wheels stay wheels.
no-binary =
# Components whose headers and libraries those builds use, by location.
build-libraries =
# pip resolves what each sdist's build needs at build time, without hashes: this
# date keeps the same versions (setuptools…) however late the release is built.
uploaded-prior-to =
bin-path = ${python-app-venv:location}/bin:${buildout:bin-directory}

# The app's software.cfg gives url and md5sum.
[python-app-requirements]
recipe = slapos.recipe.build:download
filename = requirements.txt

[python-app-venv]
recipe = slapos.recipe.build
python = ${python:executable}
requirements = ${python-app-requirements:target}
no-binary = ${python-app:no-binary}
libraries = ${python-app:build-libraries}
uploaded-prior-to = ${python-app:uploaded-prior-to}
egg = ${python-app:egg}
source = ${python-app-git:location}
home = ${buildout:directory}/tmp
install =
  import os, subprocess
  os.makedirs(options['home'], exist_ok=True)
  libraries = options['libraries'].split()
  env = dict(os.environ,
    HOME=options['home'],
    # maturin would download a Rust toolchain when it finds none on PATH.
    MATURIN_NO_INSTALL_RUST='1',
    CPPFLAGS=' '.join('-I%s/include' % l for l in libraries),
    LDFLAGS=' '.join('-L%s/lib -Wl,-rpath=%s/lib' % (l, l) for l in libraries))
  subprocess.check_call([options['python'], '-m', 'venv', location])
  pip = [location + '/bin/pip', 'install', '--no-cache-dir', '--disable-pip-version-check',
         '--uploaded-prior-to', options['uploaded-prior-to']]
  no_binary = [a for name in options['no-binary'].split() for a in ('--no-binary', name)]
  subprocess.check_call(pip + ['--require-hashes'] + no_binary + ['-r', options['requirements']], env=env)
  if options['egg']:
    subprocess.check_call(pip + ['--no-deps', options['source']], env=env)
  os.symlink('python', location + '/bin/app-python')
