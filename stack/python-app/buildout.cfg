# A Python web app from its git repository, run as Procfile-style processes.
# An app's software.cfg extends this file and fills [python-app] and
# [python-app-processes]: see README.md.
[buildout]
extends =
  ../../component/defaults.cfg
  ../../stack/slapos.cfg
  ../../stack/monitor/buildout.cfg
  ../../component/git/buildout.cfg
  ../../component/dash/buildout.cfg
  ../../component/coreutils/buildout.cfg
  buildout.hash.cfg

parts =
  slapos-cookbook
  python-app-eggs
  python-app-instance


# Filled by the app's software.cfg. The options used at build time:
[python-app]
# Names the database, its user and the frontend.
name =
repository =
branch = main
# A commit, to build the same app whatever the branch does.
revision =
# The app's distribution, installed as a develop egg from the checkout.
egg =
# Its build backend, when it isn't setuptools (pdm-backend, hatchling…).
setup-eggs =
# More eggs. zc.recipe.egg makes scripts only for the eggs listed in its part,
# not for their dependencies: an egg whose script a process runs goes here.
eggs =
scripts =
# The checkout's directory with the app's packages. Editable installs are .pth
# files, which buildout's scripts don't read: this goes on their sys.path.
source = src
# The options used by the instance, documented in README.md.
port = 8080
health =
environment =
secrets =
postgresql-bin =
mariadb-bin =
path =
library-path =
fonts =
fontconfig-includes =
fonts-conf =
# For an app that writes next to its code: run it from a copy of the build
# (copy = true), made again when build-id changes, with its volumes ("name
# target" lines: directories kept outside the copy, linked at their target).
copy = false
build-id =
volumes =
# ipv4: the app listens on $BIND_ADDRESS (or 0.0.0.0):$PORT, and a haproxy
# brings the frontend's IPv6 to it; ipv6 (the default): on [$HOST]:$PORT.
bind = ipv6

# Where the processes find the app's commands, first on their PATH.
bin-path = ${buildout:bin-directory}

# One option per process: name = shell command. "release" runs once at each
# start, the others are services, and "web" must listen on $HOST:$PORT.
[python-app-processes]


[python-app-git]
recipe = slapos.recipe.build:gitclone
repository = ${python-app:repository}
branch = ${python-app:branch}
revision = ${python-app:revision}
git-executable = ${git:location}/bin/git

[python-app-develop]
recipe = zc.recipe.egg:develop
setup = ${python-app-git:location}
setup-eggs = ${python-app:setup-eggs}
egg = ${python-app:egg}

[python-app-eggs]
recipe = zc.recipe.egg
eggs =
  ${python-app-develop:egg}
  ${python-app:eggs}
scripts = ${python-app:scripts}
extra-paths = ${python-app-git:location}/${python-app:source}
# For scripts in the checkout (`app-python scripts/….py`): a python with the eggs.
interpreter = app-python


[python-app-instance]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg
context =
  section buildout buildout
  section app python-app
  section processes python-app-processes
  raw bin_directory ${buildout:bin-directory}
  key app_directory python-app-git:location
  raw dash ${dash:location}/bin/dash
  raw path ${python-app:bin-path}:${git:location}/bin:${coreutils:location}/bin
  raw template_monitor ${monitor2-template:output}
