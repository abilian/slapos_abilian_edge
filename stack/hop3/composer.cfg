# composer, for a PHP recipe whose build runs it. A release extends this file
# after php.cfg and puts ${hop3-composer:location} in [hop3] tools: the other
# PHP releases keep their PATH as it is.
[buildout]
parts +=
  hop3-composer

[hop3-composer-phar]
recipe = slapos.recipe.build:download
url = https://getcomposer.org/download/2.11.1/composer.phar
md5sum = e271ecd6e155f0f78138f997c5115d0b

# `composer` on PATH, with the php and php.ini of the processes.
[hop3-composer]
recipe = slapos.recipe.build
phar = ${hop3-composer-phar:target}
php = ${apache-php:location}/bin/php
ini = ${hop3-php-ini:output}
install =
  import os
  os.makedirs(location)
  path = os.path.join(location, 'composer')
  with open(path, 'w') as f:
    f.write('#!/bin/sh\nPHPRC=%s exec %s %s "$@"\n'
            % (options['ini'], options['php'], options['phar']))
  os.chmod(path, 0o755)
