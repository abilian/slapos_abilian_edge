# A Hop3 recipe (a catalog app's hop3.toml and its files) as a SlapOS software
# release, on the python-app stack. The app's software.cfg, written by
# `hox port`, extends this file: see README.md.
[buildout]
extends =
  ../../component/bash/buildout.cfg
  ../../component/curl/buildout.cfg
  ../../component/findutils/buildout.cfg
  ../../component/gawk/buildout.cfg
  ../../component/git/buildout.cfg
  ../../component/grep/buildout.cfg
  ../../component/gzip/buildout.cfg
  ../../component/haproxy/buildout.cfg
  ../../component/make/buildout.cfg
  ../../component/sed/buildout.cfg
  ../../component/tar/buildout.cfg
  ../../component/unzip/buildout.cfg
  ../../stack/python-app/buildout.cfg

parts +=
  hop3-scripts
  hop3-python
  hop3-python3


[hop3]
# The recipe's files: "path md5" lines, fetched from `base`, next to the app's
# software.cfg.
base =
files =
# [build] before-build, build (when it isn't the Python toolchain's install,
# which is the eggs) and after-build, one command per line, run in the
# recipe's directory at build time.
commands =
# What the build and the processes find on PATH, besides the release's bin/
# (hop3-fetch, python, the scripts) and coreutils: what a Hop3 host has, which
# the recipes use without declaring it (gitea runs git, for one).
tools = ${:base-tools}
base-tools = ${hop3-sh:location}:${bash:location}/bin:${curl:location}/bin:${findutils:location}/bin:${gawk:location}/bin:${git:location}/bin:${grep:location}/bin:${gzip:location}/bin:${sed:location}/bin:${tar:location}/bin:${make:location}/bin:${unzip:location}/bin


# A Hop3 host's PostgreSQL has every contrib extension, and the recipes create
# them without declaring it (miniflux's migrations need hstore).
[postgresql-common]
make-targets += && make -C contrib install


# bash's component has no sh, which `npm run` and others spawn.
[hop3-sh]
recipe = slapos.recipe.build
install =
  import os
  os.makedirs(location)
  os.symlink('${bash:location}/bin/bash', os.path.join(location, 'sh'))


[python-app]
copy = true
bind = ipv4
build-id =
  ${hop3:files}
  ${hop3:commands}
source =
path = ${hop3-scripts:location}:${hop3:tools}

# The source is the recipe's directory, as on Hop3: its files, then its build
# commands, which fetch the app (hop3-fetch) and prepare it.
# ponytail: after-build runs here, before the eggs are installed; split it out
# when a recipe's after-build needs them.
[python-app-git]
recipe = slapos.recipe.build
base = ${hop3:base}
files = ${hop3:files}
commands = ${hop3:commands}
environment =
  PATH=${buildout:bin-directory}:${coreutils:location}/bin:${hop3:tools}
  LANG=C.UTF-8
  GOTOOLCHAIN=local
fetch = ${hop3-fetch:output}
install =
  import os, shutil, subprocess
  os.mkdir(location)
  for line in options['files'].splitlines():
    if not line.strip():
      continue
    path, md5 = line.split()
    target = os.path.join(location, path)
    os.makedirs(os.path.dirname(target), exist_ok=True)
    shutil.copyfile(self.download(options['base'] + '/' + path, md5), target)
  env = dict(line.split('=', 1) for line in options['environment'].split())
  env['HOME'] = env['TMPDIR'] = self.buildout['buildout']['directory'] + '/tmp'
  os.makedirs(env['HOME'], exist_ok=True)
  for command in options['commands'].splitlines():
    if command.strip():
      self.logger.info('Running: %s', command)
      subprocess.check_call(['${bash:location}/bin/bash', '-ec', command], cwd=location, env=env)

# Hop3's eggs are the app's requirements, not a develop egg of a checkout: an
# app installed from its source adds ${python-app-develop:egg} to its eggs.
[python-app-eggs]
eggs = ${python-app:eggs}

# Every console script of the eggs, as `pip install` puts them on PATH (gunicorn,
# the app's own), as zc.recipe.egg makes them, but in a directory of their own
# on the processes' PATH: SlapOS's stack has some of them in bin/ already, and
# zc.recipe.egg always writes to bin/.
[hop3-scripts]
recipe = slapos.recipe.build
eggs = ${python-app-eggs:eggs}
extra-paths = ${python-app-eggs:extra-paths}
install =
  import os, sys, zc.buildout.easy_install, zc.recipe.egg
  eggs = zc.recipe.egg.Eggs(self.buildout, self.name, {'eggs': options['eggs']})
  reqs, ws = eggs.working_set()
  os.makedirs(location)
  zc.buildout.easy_install.scripts(reqs, ws, sys.executable, location,
                                   extra_paths=options['extra-paths'].split())

# The recipes run `python -m app --option`, `python -c`, `python3 script.py`:
# a python with the eggs that reads its arguments as CPython does (buildout's
# interpreter, app-python, rejects options after -m's module).
[hop3-python]
recipe = zc.recipe.egg
eggs = ${python-app-eggs:eggs}
extra-paths = ${python-app-eggs:extra-paths}
scripts = python
entry-points = python=sys:exit
initialization =
  import runpy
  args = sys.argv[1:]
  if args[:1] == ['-m']:
      sys.argv = args[1:]
      runpy.run_module(args[1], run_name='__main__', alter_sys=True)
  elif args[:1] == ['-c']:
      sys.argv = ['-c'] + args[2:]
      exec(args[1])
  elif args:
      sys.argv = args
      runpy.run_path(args[0], run_name='__main__')
  else:
      __import__('code').interact()
  sys.exit()

[hop3-python3]
recipe = slapos.recipe.build
location = ${buildout:bin-directory}/python3
python = ${buildout:bin-directory}/${hop3-python:scripts}
install = __import__('os').symlink(options['python'], location)

# Hop3's download helper, for the recipes' before-build:
#   hop3-fetch URL [-o FILE] [--sha256 SUM]
[hop3-fetch]
recipe = slapos.recipe.template
output = ${buildout:bin-directory}/hop3-fetch
mode = 0755
inline =
  #!${bash:location}/bin/bash
  set -euo pipefail
  url= out= sum=
  while [ $# -gt 0 ]; do
    case $1 in
      -o) out=$2; shift 2 ;;
      --sha256) sum=$2; shift 2 ;;
      *) url=$1; shift ;;
    esac
  done
  # Without -o, to stdout, once checked.
  file=$out
  [ -n "$file" ] || file=$(${coreutils:location}/bin/mktemp)
  ${curl:location}/bin/curl -fsSL --retry 5 -o "$file" "$url"
  [ -z "$sum" ] || echo "$sum  $file" | ${coreutils:location}/bin/sha256sum -c --quiet -
  [ -n "$out" ] || { ${coreutils:location}/bin/cat "$file"; ${coreutils:location}/bin/rm -f "$file"; }

[python-app-instance]
context +=
  raw haproxy ${haproxy:location}/sbin/haproxy
