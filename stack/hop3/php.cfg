# A PHP recipe on the hop3 stack: php-fpm behind nginx, as on a Hop3 host, in the
# partition. A release lists component/apache-php, component/nginx and
# component/postgresql before stack/hop3/buildout.cfg, and this file after it:
# a component's parts would replace the stack's if this file extended it.
[buildout]
parts +=
  hop3-php-fpm
  hop3-php-web


# The PHP and the extensions of a Hop3 host (Ubuntu 24.04), which the recipes are
# tested on: PHP 8.4 deprecates code they run, and Paheko's CLI stops on a
# deprecation. nginx serves the app, so PHP has no Apache module, and Apache stays
# a shared part for the monitor.
[apache-php]
url = https://www.php.net/distributions/php-8.3.36.tar.xz
md5sum = 0fab641bb747c52c2cf70cde9ef33bc0
configure-options +=
  --enable-bcmath
  --with-pdo-pgsql=${postgresql:location}
  --with-pdo-sqlite=${sqlite3:location}
  --with-pgsql=${postgresql:location}
  --with-sqlite3=${sqlite3:location}
configure-options -=
  --with-apxs2=${apache:location}/bin/apxs

[apache]
shared = true

# As a Hop3 host's: Paheko's install requires FTS4. apache-php names this part in
# its flags, so it is this part that changes, with the python3 linked to it.
[sqlite3]
configure-options +=
  --enable-fts4


[hop3-php]
tools = ${apache-php:location}/bin:${apache-php:location}/sbin:${nginx:location}/sbin


# Read through PHPRC, by php-fpm and by the php of the recipes' scripts.
[hop3-php-ini]
recipe = slapos.recipe.template
output = ${buildout:parts-directory}/${:_buildout_section_name_}.ini
inline =
  [PHP]
  display_errors = Off
  log_errors = On
  memory_limit = 512M
  max_execution_time = 300
  upload_max_filesize = 1G
  post_max_size = 1G
  output_buffering = 4096
  date.timezone = UTC
  session.save_path = "$${TMPDIR}"
  sys_temp_dir = "$${TMPDIR}"
  upload_tmp_dir = "$${TMPDIR}"
  zend_extension = opcache
  opcache.enable = 1


# The pool, with what a Hop3 pool has. clear_env = no: the app reads its
# configuration from the environment. The socket's path is the partition's.
[hop3-php-fpm]
recipe = slapos.recipe.template
output = ${buildout:bin-directory}/hop3-php-fpm
mode = 0755
inline =
  #!${bash:location}/bin/bash
  set -eu
  run=$HOME/var/run
  cat > "$run/php-fpm.conf" <<EOF
  [global]
  error_log = $HOME/var/log/php-fpm.log
  daemonize = no

  [www]
  listen = $run/php-fpm.sock
  pm = dynamic
  pm.max_children = 10
  pm.start_servers = 2
  pm.min_spare_servers = 1
  pm.max_spare_servers = 4
  pm.max_requests = 500
  catch_workers_output = yes
  decorate_workers_output = no
  clear_env = no
  EOF
  exec php-fpm --nodaemonize --fpm-config "$run/php-fpm.conf"


# Serves the current directory on $HOST:$PORT, with the locations of Hop3's nginx:
# the first of public, web, htdocs and www with an index.php is the document root.
# Hidden files and $HOP3_PROXY_DENY answer 404, since nginx doesn't read .htaccess.
# The frontend ends TLS: the app sees https and port 443 from X-Forwarded-Proto.
[hop3-php-web]
recipe = slapos.recipe.template
output = ${buildout:bin-directory}/hop3-php-web
mode = 0755
inline =
  #!${bash:location}/bin/bash
  set -eu
  run=$HOME/var/run
  prefix=$run/nginx
  mkdir -p "$prefix"
  root=$PWD
  for candidate in public web htdocs www; do
    if [ -f "$candidate/index.php" ]; then
      root=$PWD/$candidate
      break
    fi
  done
  until [ -S "$run/php-fpm.sock" ]; do sleep 1; done
  echo "upstream php { server unix:$run/php-fpm.sock; }" > "$prefix/upstream.conf"
  {
    echo "listen $HOST:$PORT;"
    echo "root $root;"
    for path in $${HOP3_PROXY_DENY:-}; do
      echo "location = $path { return 404; }"
      echo "location ^~ $path/ { return 404; }"
    done
  } > "$prefix/site.conf"
  cat > "$prefix/nginx.conf" <<'EOF'
  daemon off;
  pid nginx.pid;
  error_log stderr;
  worker_processes 2;
  events { worker_connections 1024; }
  http {
    include ${nginx:location}/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 1g;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    map $http_x_forwarded_proto $app_https { default ""; https on; }
    map $http_x_forwarded_proto $app_port { default $server_port; https 443; }
    include upstream.conf;
    server {
      include site.conf;
      index index.php;
      location ~ /\.(?!well-known/) { return 404; }
      location / {
        try_files $uri $uri/ /index.php?$query_string;
      }
      location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass php;
        fastcgi_index index.php;
        include ${nginx:location}/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $app_https if_not_empty;
        fastcgi_param SERVER_PORT $app_port;
        fastcgi_read_timeout 300;
      }
    }
  }
  EOF
  exec nginx -p "$prefix/" -c nginx.conf -e stderr
